name: Tes

on:
  push:
    branches: [main, 'sinkron-*']
  pull_request:
  workflow_dispatch:

jobs:
  tes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, mbstring, gd, zip, intl, bcmath
          coverage: none

      - name: Pasang dependensi
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Siapkan .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Tes endpoint sinkron
        run: php artisan test tests/Feature/SinkronTest.php

      - name: Semua route terdaftar tanpa galat
        run: php artisan route:list --path=api/admin --no-ansi

      - name: Semua tes
        run: php artisan test
        continue-on-error: true
